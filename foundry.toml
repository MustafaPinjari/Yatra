[profile.default]
src = "blockchain/contracts"
out = "blockchain/out"
libs = ["blockchain/lib"]
test = "blockchain/test"
script = "blockchain/scripts"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "contracts/=blockchain/contracts/",
    "@contracts/=blockchain/contracts/"
]

[rpc_endpoints]
sepolia = "${ETHEREUM_SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

