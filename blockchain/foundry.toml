[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "scripts"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "contracts/=contracts/",
    "@contracts/=contracts/"
]

[rpc_endpoints]
sepolia = "${ETHEREUM_SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
