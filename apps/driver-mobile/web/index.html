<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="YATRA — Delhi Transport Corporation Driver Cab Console & Operations.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YATRA Driver">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="yatra-logo.svg"/>

  <title>YATRA — Driver Cab Console</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #070B16;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #yatra-driver-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 35%, #141F36 0%, #070B16 85%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }

    #yatra-driver-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 32px 30px 32px;
      background: #0E162B;
      border: 1px solid #1E2D4A;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
      max-width: 340px;
      width: 86%;
      text-align: center;
      position: relative;
    }

    .logo-container {
      width: 72px;
      height: 72px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(233, 104, 53, 0.3);
      transition: transform 0.3s ease;
    }

    .logo-container:hover {
      transform: scale(1.04);
    }

    .logo-img {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      object-fit: contain;
    }

    .brand-title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin: 0 0 4px 0;
      line-height: 1.15;
    }

    .brand-subtitle-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #38BDF8;
      margin: 0 0 20px 0;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background-color: #172442;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #E96835, #38BDF8);
      border-radius: 999px;
      animation: indeterminate 1.5s infinite ease-in-out;
    }

    @keyframes indeterminate {
      0% { left: -40%; width: 30%; }
      50% { left: 35%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }

    .status-text {
      font-size: 11px;
      color: #94A3B8;
      margin: 0;
      line-height: 1.45;
    }

    .footnote {
      margin-top: 20px;
      font-size: 10px;
      color: #64748B;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <!-- Styled Cab Console Splash Screen with Official Brand Logo -->
  <div id="yatra-driver-splash">
    <div class="splash-card">
      <div class="logo-container">
        <img src="yatra-logo.svg" alt="YATRA Official Brand Symbol" class="logo-img" width="72" height="72" />
      </div>
      <h1 class="brand-title">YATRA DRIVER</h1>
      <div class="brand-subtitle-badge">
        <span>DTC Cab Operations</span>
        <span>·</span>
        <span>Live Dispatch</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <p class="status-text">Connecting to Delhi Transit Stack telemetry and dispatch bus...</p>
    </div>
    <div class="footnote">Delhi Transport Corporation · Central Operations Command</div>
  </div>

  <script>
    function removeSplashScreen() {
      const splash = document.getElementById('yatra-driver-splash');
      if (splash && !splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 400);
      }
    }

    // Remove splash screen as soon as Flutter renders its first frame
    window.addEventListener('flutter-first-frame', removeSplashScreen);

    // Observer fallback for engine attachment
    const observer = new MutationObserver((mutations) => {
      for (const mutation of mutations) {
        for (const node of mutation.addedNodes) {
          if (node.nodeType === 1 && (node.tagName === 'FLUTTER-VIEW' || node.tagName === 'FLT-GLASS-PANE')) {
            setTimeout(removeSplashScreen, 300);
            observer.disconnect();
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Safety timeout in case events are suppressed
    setTimeout(removeSplashScreen, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
