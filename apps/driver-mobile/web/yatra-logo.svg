<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- YATRA Brand Symbol: Architectural Gateway & Transit Wheel -->
  <rect width="120" height="120" rx="24" fill="#172653" />
  
  <!-- Outer Wheel Ring -->
  <circle cx="60" cy="62" r="38" stroke="#E96835" stroke-width="3.5" stroke-dasharray="6 4" />
  
  <!-- Architectural Gateway Arch (India Gate Motif) -->
  <path d="M42 84V52C42 42.06 50.06 34 60 34C69.94 34 78 42.06 78 52V84" stroke="#FFFCF7" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Gateway Cornice Header -->
  <path d="M36 42H84" stroke="#F07835" stroke-width="3" stroke-linecap="round" />
  <path d="M40 38H80" stroke="#FFFCF7" stroke-width="2" stroke-linecap="round" />
  
  <!-- Accessible Transit Track / Wheel Hub -->
  <circle cx="60" cy="64" r="8" fill="#16764C" stroke="#FFFCF7" stroke-width="2" />
  <line x1="60" y1="64" x2="60" y2="84" stroke="#FFFCF7" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="84" x2="70" y2="84" stroke="#FFFCF7" stroke-width="3" stroke-linecap="round" />
</svg>
