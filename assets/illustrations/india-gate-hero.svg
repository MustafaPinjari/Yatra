<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <!-- Warm Ivory Atmosphere Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCECDD" />
      <stop offset="100%" stop-color="#F7F2E9" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F07835" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E96835" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Radiating Terracotta Sun Arch -->
  <circle cx="400" cy="300" r="220" fill="url(#sunGrad)" />
  <circle cx="400" cy="300" r="260" stroke="#E96835" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Tropical Neem / Jamun Foliage Silhouettes -->
  <path d="M60 520 C100 440, 160 460, 200 520 Z" fill="#16764C" fill-opacity="0.25" />
  <path d="M120 530 C150 480, 220 490, 250 530 Z" fill="#16764C" fill-opacity="0.4" />
  <path d="M580 520 C620 450, 700 460, 740 520 Z" fill="#16764C" fill-opacity="0.25" />
  <path d="M540 530 C580 470, 640 480, 680 530 Z" fill="#16764C" fill-opacity="0.35" />

  <!-- India Gate Architectural Structure -->
  <!-- Base Plinth -->
  <rect x="250" y="440" width="300" height="40" fill="#E5C39E" stroke="#101B3A" stroke-width="3" rx="4" />
  <rect x="230" y="470" width="340" height="20" fill="#D4A373" stroke="#101B3A" stroke-width="3" rx="4" />

  <!-- Main Arch Columns -->
  <rect x="270" y="220" width="80" height="220" fill="#E5C39E" stroke="#101B3A" stroke-width="3" />
  <rect x="450" y="220" width="80" height="220" fill="#E5C39E" stroke="#101B3A" stroke-width="3" />

  <!-- Central Great Arch -->
  <path d="M350 440 V290 C350 250, 450 250, 450 290 V440 Z" fill="#F7F2E9" stroke="#101B3A" stroke-width="3.5" />
  
  <!-- Cornice & Architrave Bands -->
  <rect x="240" y="190" width="320" height="30" fill="#D4A373" stroke="#101B3A" stroke-width="3" rx="2" />
  <rect x="220" y="170" width="360" height="20" fill="#E5C39E" stroke="#101B3A" stroke-width="3" rx="2" />

  <!-- Top Inscription Attic -->
  <rect x="260" y="110" width="280" height="60" fill="#E5C39E" stroke="#101B3A" stroke-width="3" rx="3" />
  <!-- Inscription Lines -->
  <line x1="280" y1="130" x2="520" y2="130" stroke="#101B3A" stroke-width="2" stroke-linecap="round" />
  <line x1="300" y1="145" x2="500" y2="145" stroke="#101B3A" stroke-width="2" stroke-linecap="round" />

  <!-- Top Bowl / Chhatri finial -->
  <ellipse cx="400" cy="100" rx="45" ry="10" fill="#D4A373" stroke="#101B3A" stroke-width="2.5" />
  <path d="M370 100 Q400 70 430 100 Z" fill="#E96835" stroke="#101B3A" stroke-width="2.5" />

  <!-- Rajpath Transit Roadway -->
  <rect x="0" y="490" width="800" height="110" fill="#101B3A" />
  <line x1="0" y1="545" x2="800" y2="545" stroke="#FACC15" stroke-width="4" stroke-dasharray="30 20" />

  <!-- Foreground Low-Floor DTC Bus -->
  <g transform="translate(180, 460)">
    <!-- Bus Body Shell -->
    <rect x="0" y="0" width="440" height="95" rx="14" fill="#16764C" stroke="#FFFFFF" stroke-width="3" />
    <rect x="0" y="55" width="440" height="40" fill="#0D4A2F" rx="8" />

    <!-- Route LED Display -->
    <rect x="25" y="10" width="130" height="20" rx="4" fill="#0B132B" />
    <text x="35" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FACC15">502 KASHMERE GATE</text>

    <!-- Passenger Panoramic Windows -->
    <rect x="170" y="10" width="70" height="35" rx="5" fill="#E4F1E5" stroke="#101B3A" stroke-width="1.5" />
    <rect x="250" y="10" width="70" height="35" rx="5" fill="#E4F1E5" stroke="#101B3A" stroke-width="1.5" />
    <rect x="330" y="10" width="70" height="35" rx="5" fill="#E4F1E5" stroke="#101B3A" stroke-width="1.5" />

    <!-- Wheelchair Symbol on Accessible Middle Door -->
    <circle cx="285" cy="65" r="10" fill="#E4F1E5" />
    <path d="M285 59 A2 2 0 1 1 285 63 A2 2 0 1 1 285 59 M285 64 V68 H289 M283 67 A4 4 0 1 0 287 71" stroke="#16764C" stroke-width="1.5" fill="none" />

    <!-- Low-Floor Wheels -->
    <circle cx="80" cy="95" r="24" fill="#101B3A" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="80" cy="95" r="10" fill="#CBD5E1" />
    <circle cx="360" cy="95" r="24" fill="#101B3A" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="360" cy="95" r="10" fill="#CBD5E1" />

    <!-- Headlights & Tail Lights -->
    <rect x="430" y="45" width="8" height="18" rx="3" fill="#FACC15" />
    <rect x="0" y="45" width="6" height="18" rx="2" fill="#DC2626" />
  </g>
</svg>

