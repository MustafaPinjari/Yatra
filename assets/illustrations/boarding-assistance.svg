<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <!-- Empathetic Boarding Assistance Narrative Scene -->
  <!-- Warm Background Canvas -->
  <rect width="800" height="450" fill="#F7F2E9" />
  
  <!-- Bus Shelter Canopy in Background -->
  <rect x="80" y="60" width="640" height="20" rx="4" fill="#172653" />
  <line x1="120" y1="80" x2="120" y2="380" stroke="#172653" stroke-width="8" />
  <line x1="680" y1="80" x2="680" y2="380" stroke="#172653" stroke-width="8" />

  <!-- Tactile Paving Strip on Platform -->
  <rect x="0" y="380" width="800" height="70" fill="#E5C39E" />
  <rect x="60" y="385" width="680" height="24" fill="#FACC15" stroke="#D97706" stroke-width="1.5" />
  <!-- Tactile Paving Raised Studs -->
  <circle cx="100" cy="397" r="4" fill="#B45309" />
  <circle cx="140" cy="397" r="4" fill="#B45309" />
  <circle cx="180" cy="397" r="4" fill="#B45309" />
  <circle cx="220" cy="397" r="4" fill="#B45309" />
  <circle cx="260" cy="397" r="4" fill="#B45309" />
  <circle cx="300" cy="397" r="4" fill="#B45309" />
  <circle cx="340" cy="397" r="4" fill="#B45309" />
  <circle cx="380" cy="397" r="4" fill="#B45309" />
  <circle cx="420" cy="397" r="4" fill="#B45309" />
  <circle cx="460" cy="397" r="4" fill="#B45309" />
  <circle cx="500" cy="397" r="4" fill="#B45309" />
  <circle cx="540" cy="397" r="4" fill="#B45309" />
  <circle cx="580" cy="397" r="4" fill="#B45309" />
  <circle cx="620" cy="397" r="4" fill="#B45309" />
  <circle cx="660" cy="397" r="4" fill="#B45309" />
  <circle cx="700" cy="397" r="4" fill="#B45309" />

  <!-- DTC Low-Floor Bus Doorway (Right Side) -->
  <g transform="translate(480, 100)">
    <!-- Bus Side Profile -->
    <rect x="0" y="0" width="300" height="280" fill="#16764C" stroke="#101B3A" stroke-width="4" rx="16" />
    <!-- Double Boarding Doors Open -->
    <rect x="30" y="30" width="160" height="250" fill="#E4F1E5" stroke="#101B3A" stroke-width="3" />
    <!-- Handrail Support inside Doorway -->
    <line x1="50" y1="50" x2="50" y2="280" stroke="#FACC15" stroke-width="6" stroke-linecap="round" />
    <line x1="170" y1="50" x2="170" y2="280" stroke="#FACC15" stroke-width="6" stroke-linecap="round" />
    <!-- Conductor Welcoming Passenger -->
    <circle cx="140" cy="90" r="18" fill="#D4A373" stroke="#101B3A" stroke-width="2" />
    <rect x="120" y="110" width="40" height="80" rx="8" fill="#172653" stroke="#101B3A" stroke-width="2" />
    <!-- Conductor Welcoming Arm Gesture -->
    <path d="M120 130 Q90 140 70 120" stroke="#172653" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Deployed Ramp Connecting Platform to Bus Floor -->
  <polygon points="400,380 520,380 500,360 400,360" fill="#FACC15" stroke="#101B3A" stroke-width="3" />
  
  <!-- Smiling Passenger in Active Manual Wheelchair (Boarding Smoothly) -->
  <g transform="translate(240, 180)">
    <!-- Passenger Head & Torso -->
    <circle cx="80" cy="40" r="22" fill="#D4A373" stroke="#101B3A" stroke-width="3" />
    <!-- Friendly Smile -->
    <path d="M72 45 Q80 53 88 45" stroke="#101B3A" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Torso -->
    <rect x="55" y="65" width="50" height="75" rx="12" fill="#E96835" stroke="#101B3A" stroke-width="3" />
    <!-- Arm pushing wheelchair hand-rim -->
    <path d="M60 85 L35 125 L75 140" stroke="#101B3A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Legs -->
    <path d="M95 130 L135 140 L135 185" stroke="#172653" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Modern Lightweight Sports Wheelchair -->
    <!-- Wheelchair Frame -->
    <path d="M50 110 L80 150 L120 150" stroke="#101B3A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Main Large Rear Wheel -->
    <circle cx="60" cy="160" r="45" stroke="#101B3A" stroke-width="6" fill="#FFFCF7" />
    <circle cx="60" cy="160" r="38" stroke="#E96835" stroke-width="3" fill="none" />
    <!-- Spokes -->
    <line x1="60" y1="115" x2="60" y2="205" stroke="#101B3A" stroke-width="2" />
    <line x1="15" y1="160" x2="105" y2="160" stroke="#101B3A" stroke-width="2" />
    <line x1="28" y1="128" x2="92" y2="192" stroke="#101B3A" stroke-width="2" />
    <line x1="28" y1="192" x2="92" y2="128" stroke="#101B3A" stroke-width="2" />
    <!-- Front Caster Wheel -->
    <circle cx="130" cy="195" r="10" fill="#101B3A" />
  </g>

  <!-- Commuter with White Cane Guided by Tactile Paving (Left Side) -->
  <g transform="translate(100, 160)">
    <!-- Passenger Head with Glasses -->
    <circle cx="40" cy="50" r="20" fill="#D4A373" stroke="#101B3A" stroke-width="2.5" />
    <rect x="30" y="46" width="22" height="6" rx="3" fill="#101B3A" />
    <!-- Body -->
    <rect x="22" y="72" width="36" height="90" rx="8" fill="#16764C" stroke="#101B3A" stroke-width="2.5" />
    <!-- Legs -->
    <line x1="30" y1="162" x2="30" y2="225" stroke="#172653" stroke-width="7" stroke-linecap="round" />
    <line x1="48" y1="162" x2="52" y2="225" stroke="#172653" stroke-width="7" stroke-linecap="round" />
    <!-- White Cane with Red Tip Touching Tactile Tiles -->
    <line x1="45" y1="105" x2="95" y2="228" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="90" y1="215" x2="95" y2="228" stroke="#DC2626" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
