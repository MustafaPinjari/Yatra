<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <!-- Delhi Transit Grid Schematic Cartography -->
  <rect width="800" height="600" fill="#F7F2E9" />
  
  <!-- Subtle Grid Lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E6DDD0" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Yamuna River Ribbon -->
  <path d="M600 0 C580 120, 640 240, 620 360 C600 480, 660 540, 650 600" stroke="#BFDBFE" stroke-width="32" stroke-linecap="round" fill="none" />

  <!-- Ring Road Transit Corridor (Emerald Green) -->
  <circle cx="380" cy="320" r="180" stroke="#16764C" stroke-width="8" stroke-dasharray="16 6" fill="none" />

  <!-- Outer Ring Road Transit Corridor (Dashed Navy) -->
  <circle cx="380" cy="320" r="260" stroke="#172653" stroke-width="6" stroke-opacity="0.4" stroke-dasharray="12 8" fill="none" />

  <!-- Radial Route 502 (Terracotta Corridor) -->
  <line x1="380" y1="40" x2="380" y2="560" stroke="#E96835" stroke-width="8" stroke-linecap="round" />

  <!-- Transit Interchange Nodes -->
  <!-- Kashmere Gate (North) -->
  <circle cx="380" cy="140" r="16" fill="#172653" stroke="#FFFCF7" stroke-width="4" />
  <circle cx="380" cy="140" r="6" fill="#E96835" />
  <text x="405" y="145" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#101B3A">Kashmere Gate ISBT</text>

  <!-- Central Secretariat / India Gate -->
  <circle cx="380" cy="300" r="14" fill="#16764C" stroke="#FFFCF7" stroke-width="3.5" />
  <text x="405" y="305" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#101B3A">Central Secretariat</text>

  <!-- AIIMS / Safdarjung (South) -->
  <circle cx="380" cy="420" r="14" fill="#172653" stroke="#FFFCF7" stroke-width="3.5" />
  <text x="405" y="425" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#101B3A">AIIMS Interchange</text>

  <!-- Live Bus Marker (Approaching Central Secretariat) -->
  <g transform="translate(365, 230)">
    <circle cx="15" cy="15" r="22" fill="#E96835" fill-opacity="0.25" />
    <circle cx="15" cy="15" r="14" fill="#E96835" stroke="#FFFCF7" stroke-width="3" />
    <polygon points="12,8 24,15 12,22" fill="#FFFCF7" />
  </g>
</svg>

