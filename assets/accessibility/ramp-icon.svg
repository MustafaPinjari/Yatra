<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Wheelchair Ramp Icon -->
  <rect width="64" height="64" rx="16" fill="#E4F1E5" />
  <!-- Platform -->
  <line x1="8" y1="48" x2="24" y2="48" stroke="#16764C" stroke-width="4" stroke-linecap="round" />
  <!-- Bus Floor -->
  <line x1="44" y1="32" x2="56" y2="32" stroke="#16764C" stroke-width="4" stroke-linecap="round" />
  <!-- Ramp Slope -->
  <line x1="24" y1="48" x2="44" y2="32" stroke="#E96835" stroke-width="5" stroke-linecap="round" />
  <!-- Arrow Indicator -->
  <polyline points="30,34 38,36 36,44" stroke="#E96835" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>

